logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins:
  - "*"

webrtcAdditionalHosts:
  - localhost
  - 127.0.0.1

webrtcLocalTCPAddress: :8189

webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

authMethod: jwt
# authJWTJWKS: http://keycloak:8080/realms/mediamtx/protocol/openid-connect/certs
authJWTJWKS: https://taticokey.spocws.icu/realms/tatico/protocol/openid-connect/certs
authJWTClaimKey: mediamtx_permissions

paths:
  all:
    source: publisher
    overridePublisher: no
