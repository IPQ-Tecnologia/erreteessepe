  #         echo -e 'GET /realms/mediamtx/protocol/openid-connect/certs HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
  #         head -n 1 <&3 | grep -q '200 OK'"
  #     interval: 5s
