port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  use_ice_lite: false
  enable_loopback_candidate: true
  use_mdns: false
  # Explicit STUN servers help browsers (notably Firefox in some NAT setups)
  # gather non-host ICE candidates when local/mDNS candidates are unusable.
  stun_servers:
    - stun.l.google.com:19302
    - stun1.l.google.com:19302
    - global.stun.twilio.com:3478

redis:
  address: redis:6379

keys:
  devkey: devsecret_devsecret_devsecret_2026

ingress:
  rtmp_base_url: rtmp://livekit-ingress:1935/rtmp
  whip_base_url: http://livekit-ingress:8080/whip

turn:
  enabled: true
  # Local dev profile: prefer explicit loopback address for Firefox TURN resolution.
  # If viewers connect from another machine, replace with the host's LAN/DNS name.
  domain: 127.0.0.1
  udp_port: 3478
  relay_range_start: 50000
  relay_range_end: 50100
