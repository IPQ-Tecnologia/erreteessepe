<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .topbar h1 {
            margin: 0;
            font-size: 1.3rem;
        }

        #sessionInfo {
            color: #b6bec8;
            font-size: 0.9rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 220px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #2c2c2c;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        #btnPlay { background-color: #2196F3; color: white; }
        #btnPlay:disabled { background-color: #555; cursor: not-allowed; }

        #btnStop { background-color: #f44336; color: white; }
        #btnStop:disabled { background-color: #555; cursor: not-allowed; }

        #btnLogout { background-color: #757575; color: white; }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: black;
            border-radius: 4px;
            overflow: hidden;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #statusLog {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #888;
            font-family: monospace;
            min-height: 20px;
        }

        .error { color: #ff5252 !important; }
        .success { color: #4caf50 !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>Monitoramento WebRTC</h1>
            <div>
                <span id="sessionInfo">Validando sessão...</span>
                <button id="btnLogout" type="button">SAIR</button>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="cameraId" placeholder="ID da Câmera (ex: camera02)" value="camera02">
            <button id="btnPlay">ASSISTIR</button>
            <button id="btnStop" disabled>PARAR</button>
        </div>

        <div class="video-wrapper">
            <video id="remoteVideo" autoplay playsinline muted controls></video>
        </div>

        <div id="statusLog">Aguardando conexão...</div>
    </div>

    <script>
        let pc = null;
        const videoEl = document.getElementById('remoteVideo');
        const btnPlay = document.getElementById('btnPlay');
        const btnStop = document.getElementById('btnStop');
        const btnLogout = document.getElementById('btnLogout');
        const inputId = document.getElementById('cameraId');
        const statusLog = document.getElementById('statusLog');
        const sessionInfo = document.getElementById('sessionInfo');

        function log(msg, type = 'info') {
            statusLog.innerText = msg;
            statusLog.className = type === 'error' ? 'error' : (type === 'success' ? 'success' : '');
            console.log(`[Player] ${msg}`);
        }

        async function readErrorMessage(response, fallbackMessage) {
            const contentType = response.headers.get('content-type') || '';

            if (contentType.includes('application/json')) {
                const payload = await response.json().catch(() => null);
                const detail = payload?.detail;
                if (typeof detail === 'string' && detail) return detail;
                if (detail && typeof detail.message === 'string' && detail.message) return detail.message;
            }

            const bodyText = await response.text().catch(() => '');
            return bodyText || fallbackMessage;
        }

        async function ensureSession() {
            const response = await fetch('/auth/me', { credentials: 'include' });
            if (!response.ok) {
                window.location.href = '/';
                return false;
            }
            const payload = await response.json();
            if (!payload.authenticated) {
                window.location.href = '/';
                return false;
            }
            sessionInfo.textContent = `Usuário: ${payload.username}`;
            return true;
        }

        async function logout() {
            await fetch('/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.href = '/';
        }

        function waitForIceGathering(pc, timeoutMs = 500) {
            return new Promise((resolve) => {
                if (pc.iceGatheringState === 'complete') {
                    resolve();
                    return;
                }

                const timeoutId = setTimeout(() => {
                    pc.removeEventListener('icegatheringstatechange', checkState);
                    resolve();
                }, timeoutMs);

                const checkState = () => {
                    if (pc.iceGatheringState === 'complete') {
                        clearTimeout(timeoutId);
                        pc.removeEventListener('icegatheringstatechange', checkState);
                        resolve();
                    }
                };
                pc.addEventListener('icegatheringstatechange', checkState);
            });
        }

        function normalizeIceServers(iceServers) {
            if (!Array.isArray(iceServers) || iceServers.length === 0) {
                return [{ urls: 'stun:stun.l.google.com:19302' }];
            }

            return iceServers
                .map((server) => {
                    const urls = Array.isArray(server?.urls)
                        ? server.urls.filter(Boolean)
                        : (server?.urls ? [server.urls] : []);

                    if (urls.length === 0) return null;

                    return {
                        urls: urls.length === 1 ? urls[0] : urls,
                        username: server.username || undefined,
                        credential: server.credential || undefined,
                    };
                })
                .filter(Boolean);
        }

        async function startStream() {
            const cameraId = inputId.value.trim();
            if (!cameraId) return alert('Digite um ID de câmera');

            log('Iniciando...', 'info');
            btnPlay.disabled = true;
            btnStop.disabled = false;

            try {
                log(`Buscando config para: ${cameraId}...`);
                const configResponse = await fetch(
                    `/stream/${cameraId}`,
                    { credentials: 'include' }
                );

                if (!configResponse.ok) {
                    throw new Error(await readErrorMessage(
                        configResponse,
                        `Erro na API Python: ${configResponse.status}`
                    ));
                }

                const configData = await configResponse.json();

                let {
                    url: signalingUrl,
                    auth_type: authType,
                    username,
                    password,
                    token,
                    ice_servers: configuredIceServers
                } = configData.webrtc;

                if (!signalingUrl.endsWith('/whep')) {
                    signalingUrl = signalingUrl.replace(/\/$/, '') + '/whep';
                }

                const iceServers = normalizeIceServers(configuredIceServers);
                log(`Usando ${iceServers.length} ICE server(s)...`);

                pc = new RTCPeerConnection({
                    iceServers
                });

                pc.addTransceiver('video', { direction: 'recvonly' });

                pc.ontrack = (event) => {
                    log('Stream recebido! Reproduzindo...', 'success');
                    videoEl.srcObject = event.streams[0];
                };

                pc.onconnectionstatechange = () => {
                    if (pc.connectionState === 'failed') {
                        log('Falha na conexão WebRTC', 'error');
                        stopStream();
                    }
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                await waitForIceGathering(pc);

                log('Enviando oferta WHEP...');

                const headers = { 'Content-Type': 'application/sdp' };
                if (authType === 'bearer' && token) {
                    headers['Authorization'] = `Bearer ${token}`;
                } else if (username && password) {
                    headers['Authorization'] = 'Basic ' + btoa(`${username}:${password}`);
                }

                const whepResponse = await fetch(signalingUrl, {
                    method: 'POST',
                    credentials: 'include',
                    headers: headers,
                    body: pc.localDescription.sdp
                });

                if (!whepResponse.ok) {
                    throw new Error(await readErrorMessage(
                        whepResponse,
                        `Erro no MediaMTX: ${whepResponse.status}`
                    ));
                }

                const answerSdp = await whepResponse.text();
                await pc.setRemoteDescription(new RTCSessionDescription({
                    type: 'answer',
                    sdp: answerSdp
                }));
            } catch (error) {
                log(`Erro: ${error.message}`, 'error');
                stopStream();
            }
        }

        function stopStream() {
            if (pc) {
                pc.close();
                pc = null;
            }
            videoEl.srcObject = null;
            btnPlay.disabled = false;
            btnStop.disabled = true;
            if (statusLog.className !== 'error') log('Desconectado');
        }

        btnPlay.addEventListener('click', startStream);
        btnStop.addEventListener('click', stopStream);
        btnLogout.addEventListener('click', logout);

        ensureSession().catch(() => {
            window.location.href = '/';
        });
    </script>
</body>
</html>
